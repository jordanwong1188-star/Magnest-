name: Catalog storefront review
on:
  push:
    branches:
      - magnanest-rebuild-review
    paths-ignore:
      - 'review/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magnanest-catalog-review
  cancel-in-progress: true
jobs:
  browser-review:
    if: github.ref == 'refs/heads/magnanest-rebuild-review'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magnanest-rebuild-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the static storefront
        run: node scripts/build-cloudflare.mjs
      - name: Package and verify the ready-to-upload website
        run: |
          mkdir -p review
          rm -f review/magnanest-cloudflare-upload.zip
          cd dist
          zip -q -r ../review/magnanest-cloudflare-upload.zip .
          cd ..
          unzip -t review/magnanest-cloudflare-upload.zip > review/upload-package.txt
      - name: Install browser dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review the product, promotions and checkout navigation
        run: node tools/browser-check.mjs
      - name: Record screenshots, results and the upload package
        if: always()
        run: |
          if [ ! -d review ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[skip ci] Record catalog storefront review"
          git push origin HEAD:magnanest-rebuild-review
